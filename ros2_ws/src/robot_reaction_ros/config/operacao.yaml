# Parâmetros de operação do body_node (padrões são chute: ajustar no robô).
# Spec: docs/superpowers/specs/2026-11-04-aproximacao-e-estagios-design.md
/**:  # chave curinga: com "body_node:" o Foxy ignoraria as sobrescritas do launch
  ros__parameters:
    estagios: "virar,aproximar,fala,posturas,meia_volta"  # quais estágios rodam (aproximar inclui virar)
    detections_topic: /face_recognition/detections
    so_equilibrio: false  # true: só inicializa já em equilíbrio (FSM 801), sem damp → em pé
    largura_imagem: 640  # largura em pixels da imagem das detecções
    altura_caixa_alvo_px: 90.0  # para de andar com a caixa do rosto desta altura (escolher desarmado)
    inverter_giro: false  # troca o sinal do giro se ele for para o lado errado
    centro_ok: 0.15  # desvio aceito como "de frente" (fração da meia largura)
    centro_para_andar: 0.45  # só anda para frente com desvio menor que este (0,30 fazia anda-e-para)
    centro_chegada: 0.30  # já perto: desvio aceito como "de frente" para cumprimentar
    vyaw_max: 0.3  # giro máximo (rad/s)
    vyaw_min: 0.3  # giro mínimo parado (rad/s): abaixo disso o G1 não gira no lugar (0,22 não girou)
    vx: 0.2  # velocidade para frente (m/s, constante)
    kp_giro: 0.6  # ganho do giro (rad/s por desvio 1,0)
    perda_rosto_s: 1.0  # sem ver o rosto por isso → para até ver de novo (quem desiste é o desistir_s)
    desistir_s: 10.0  # rosto sumido por isso → desiste
    tempo_max_s: 30.0  # aproximação mais longa que isso → desiste
    avisos_voz: true  # depuração: fala "Perdi <nome> de vista" ao desistir (só nesse caso)
    vyaw_meia_volta: 0.5  # giro da meia-volta (rad/s)
    tolerancia_meia_volta_graus: 10.0  # erro de ângulo aceito ao fechar a meia-volta
    passo_m: 0.2  # passo para frente depois de virar (m); 0 desliga
    vx_passo: 0.2  # velocidade do passo (m/s)
    tempo_max_meia_volta_s: 12.0  # meia-volta mais longa que isso → desiste
