# Quem dispara reação e qual. Nome = o mesmo do cadastro (pasta em data/known_faces/<nome>/).
# Cada pessoa tem `passos`: a rotina militar (body_node; launch rotina.launch.py), em ordem. Cada
# passo é `postura: <sentido|descansar|continencia|desc_arma|a_vontade>`, `fala: <texto>` ou
# `pausa: <segundos>` (espera extra; substitui os 0,5 s automáticos depois da postura).
# A última postura tem que ser a_vontade (devolve os braços e solta o arm_sdk).
# Fala: escreva como deve SOAR no Piper ("Nichinica", não "Nixinica").
gil:
  passos:
    - postura: sentido
    - postura: continencia
    - fala: "Olá, aspirante a oficial da reserva Gil, sou o Tenente Nichinica"
    - postura: desc_arma
    - postura: descansar
    - pausa: 15
    - postura: a_vontade
marcos:
  passos:
    - postura: sentido
    - postura: continencia
    - fala: "Olá, aspirante a oficial da reserva Marcos, sou o Tenente Nichinica"
    - postura: desc_arma
    - postura: descansar
    - pausa: 15
    - postura: a_vontade
