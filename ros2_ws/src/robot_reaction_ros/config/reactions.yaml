# Quem dispara reação e qual. Nome = o mesmo do cadastro (pasta em data/known_faces/<nome>/).
# Cada pessoa tem UM de:
#   gesto: gesto pronto do firmware (gesture_node; launch robo.launch.py). Válidos: GESTOS em
#          core/reaction_policy.py (ex.: high wave, face wave, shake hand, clap).
#   passos: rotina militar (body_node; launch rotina.launch.py), em ordem. Cada passo é
#          `postura: <sentido|descansar|continencia|desc_arma|a_vontade>` ou `fala: <texto>`.
#          A última postura tem que ser a_vontade (devolve os braços e solta o arm_sdk).
#          Fala: escreva como deve SOAR no Piper ("Nichinica", não "Nixinica").
gil:
  passos:
    - postura: sentido
    - fala: "Olá, aspirante a oficial da reserva Gil, sou o Tenente Nichinica"
    - postura: descansar
    - postura: a_vontade
    - fala: "Bom ver o senhor"
marcos:
  passos:
    - postura: sentido
    - fala: "Olá, aspirante a oficial da reserva Marcos, sou o Tenente Nichinica"
    - postura: descansar
    - postura: a_vontade
    - fala: "Bom ver o senhor"
