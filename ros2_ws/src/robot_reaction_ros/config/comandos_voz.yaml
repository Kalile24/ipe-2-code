# Comandos de voz do operador (F2 + Y segurado, falar). Cada comando: as palavras que o
# reconhecem (palavra inteira, sem acento nem maiúscula) e os passos, como em reactions.yaml,
# mas sem obrigar a terminar em a_vontade: sentido, continência e atenção mantêm a posição.
# A fala é escrita como deve soar.
nao_entendi: "Não entendi, repita o comando"
comandos:
  sentido:
    palavras: [sentido]
    passos:
      - postura: sentido
  continencia:
    palavras: [continencia]
    passos:
      - postura: continencia
  atencao:
    palavras: [atencao]
    passos:
      - postura: descansar
  apresentacao:
    palavras: [apresentacao, apresente se]
    passos:
      - postura: sentido
      - fala: Sou o Tenente Nichinica
      - postura: a_vontade
  a_vontade:
    palavras: [a vontade]
    passos:
      - postura: a_vontade
